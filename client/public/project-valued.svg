<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-val" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e110a" />
      <stop offset="100%" stop-color="#050604" />
    </linearGradient>
    <linearGradient id="lime-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8ff38" />
      <stop offset="100%" stop-color="#00f59b" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg-val)" />
  <rect x="2" y="2" width="796" height="496" rx="22" fill="none" stroke="#c8ff38" stroke-width="1.5" stroke-opacity="0.25" />
  
  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Pathway Nodes Network -->
  <g stroke="#c8ff38" stroke-width="2" stroke-opacity="0.5" fill="none">
    <path d="M 150 250 Q 280 140 400 240 T 650 200" />
    <path d="M 150 250 Q 300 360 480 300 T 650 360" stroke-dasharray="6,6" />
  </g>

  <circle cx="150" cy="250" r="18" fill="#14180d" stroke="#c8ff38" stroke-width="3" />
  <circle cx="280" cy="170" r="12" fill="#14180d" stroke="#c8ff38" stroke-width="2" />
  <circle cx="400" cy="240" r="22" fill="#14180d" stroke="#00f59b" stroke-width="3" />
  <circle cx="480" cy="300" r="14" fill="#14180d" stroke="#c8ff38" stroke-width="2" />
  <circle cx="650" cy="200" r="26" fill="#14180d" stroke="#c8ff38" stroke-width="3.5" />
  <circle cx="650" cy="360" r="16" fill="#14180d" stroke="#00e5ff" stroke-width="2" />

  <!-- Node Pulsing Rings -->
  <circle cx="650" cy="200" r="38" fill="none" stroke="#c8ff38" stroke-width="1" stroke-opacity="0.3" />
  <circle cx="400" cy="240" r="32" fill="none" stroke="#00f59b" stroke-width="1" stroke-opacity="0.3" />

  <!-- Badge / Text Overlay -->
  <text x="60" y="70" font-family="'Space Grotesk', monospace" font-size="14" fill="#c8ff38" letter-spacing="2" font-weight="700">VALUED · PATHWAYS PLATFORM</text>
  <text x="60" y="440" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#ffffff" font-weight="800">Career &amp; Higher Education Graph</text>
  <text x="60" y="468" font-family="monospace" font-size="14" fill="#8f8e89">15,000+ Active Pathway Trajectories · Sub-100ms Matching</text>
</svg>
