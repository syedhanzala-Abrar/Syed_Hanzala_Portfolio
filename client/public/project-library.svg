<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-lib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081014" />
      <stop offset="100%" stop-color="#040709" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg-lib)" />
  <rect x="2" y="2" width="796" height="496" rx="22" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Data Tables / Index Grid Bars -->
  <g fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3">
    <rect x="180" y="140" width="440" height="40" rx="8" />
    <rect x="180" y="195" width="440" height="40" rx="8" />
    <rect x="180" y="250" width="440" height="40" rx="8" />
    <rect x="180" y="305" width="440" height="40" rx="8" />
  </g>

  <!-- Query Latency Gauge -->
  <circle cx="220" cy="160" r="8" fill="#00e5ff" />
  <circle cx="220" cy="215" r="8" fill="#00f59b" />
  <circle cx="220" cy="270" r="8" fill="#c8ff38" />
  <circle cx="220" cy="325" r="8" fill="#00e5ff" />

  <line x1="250" y1="160" x2="450" y2="160" stroke="#00e5ff" stroke-width="4" stroke-linecap="round" />
  <line x1="250" y1="215" x2="520" y2="215" stroke="#00f59b" stroke-width="4" stroke-linecap="round" />
  <line x1="250" y1="270" x2="380" y2="270" stroke="#c8ff38" stroke-width="4" stroke-linecap="round" />
  <line x1="250" y1="325" x2="490" y2="325" stroke="#00e5ff" stroke-width="4" stroke-linecap="round" />

  <text x="60" y="70" font-family="'Space Grotesk', monospace" font-size="14" fill="#00e5ff" letter-spacing="2" font-weight="700">DISTRIBUTED LIBRARY SYSTEM</text>
  <text x="60" y="440" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#ffffff" font-weight="800">High-Performance Catalog Engine</text>
  <text x="60" y="468" font-family="monospace" font-size="14" fill="#8f8e89">4.2ms Query Speed · 1M+ Catalog Records · Strict ACID Locks</text>
